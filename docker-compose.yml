services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/tresto.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - reverb
    networks:
      - app

  frontend:
    build:
      context: ./tresto-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_BASE_API_URL: http://backend:8100/api
      BACKBLAZE_REGION: ca-east-006
      BACKBLAZE_KEY_ID: 006feaf17717d010000000001
      BACKBLAZE_APPLICATION_KEY: K006JGRdvxf4UDFTw9ODhvFhQWOsVnk
      BACKBLAZE_BUCKET_ID: 4fcefa7fb1573711a70d0011
      BACKBLAZE_BUCKET_NAME: tresto
      BACKBLAZE_ENDPOINT: https://s3.ca-east-006.backblazeb2.com
    expose:
      - "3000"
    networks:
      - app

  backend:
    build:
      context: ./iq_menu_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./iq_menu_backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    expose:
      - "8100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in root .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  reverb:
    build:
      context: ./iq_menu_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./iq_menu_backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

networks:
  app:

volumes:
  postgres_data